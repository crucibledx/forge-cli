name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.6.18)'
        required: true
        type: string
      dry_run:
        description: 'Run every check and build but publish nothing (npm, GitHub release, Homebrew, Scoop)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  REPO: crucibledx/forge-cli
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ inputs.dry_run == true }}

# Public channels publish strictly in order: npm, then the GitHub release, then Homebrew and Scoop.
# Nothing publishes until the tagged commit has a green CI gate, the release checks pass and the
# built binary runs, so a failure anywhere stops the release before any channel moves ahead of npm.
jobs:
  # ── 1. CI gate on the tagged commit + full release checks ────────
  ci-gate:
    name: CI Gate on Tagged Commit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Require a green Deterministic gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse 'HEAD^{commit}')"
          echo "${TAG} points at ${sha}"
          # CI can still be running when a tag is pushed right after a merge, so wait for it.
          grace=$((SECONDS + 5 * 60))
          deadline=$((SECONDS + 25 * 60))
          while :; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "" else "\(.id) \(.status) \(.html_url)" end')"
            read -r run_id run_status run_url <<<"${run}"
            if [ -z "${run}" ]; then
              if (( SECONDS >= grace )); then
                echo "::error::CI never ran on ${sha}. Tag a commit on main after its CI run is green."
                exit 1
              fi
              echo "No CI run for ${sha} yet, waiting..."
            elif [ "${run_status}" = completed ]; then
              gate="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                --jq '[.jobs[] | select(.name == "Deterministic gate")] | last | .conclusion // "missing"')"
              if [ "${gate}" = success ]; then
                echo "Deterministic gate passed on ${sha}: ${run_url}"
                exit 0
              fi
              echo "::error::Deterministic gate is '${gate}' on ${sha} (${run_url}). Fix CI on main, then tag a commit whose gate is green."
              exit 1
            else
              echo "CI run ${run_url} is ${run_status}, waiting..."
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::Timed out waiting for CI on ${sha} (${run_url:-no run}). Re-run this job once CI has finished."
              exit 1
            fi
            sleep 30
          done

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test

  # ── 2. Cross-compile binaries for all platforms ──────────────────
  build:
    name: Build Binaries
    needs: [ quality, test ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Cross-compile all targets
        run: |
          targets=("linux-x64" "linux-arm64" "darwin-arm64" "darwin-x64" "windows-x64")
          for target in "${targets[@]}"; do
            ext=""
            [[ "$target" == windows-* ]] && ext=".exe"
            echo "→ Building forge-${target}${ext}"
            bun build src/main.ts --compile --target="bun-${target}" --outfile "dist/forge-${target}${ext}"
          done

      - name: Smoke-test linux-x64 binary
        run: |
          expected="${TAG#v}"
          actual="$(dist/forge-linux-x64 --version)"
          echo "forge-linux-x64 --version: ${actual}"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Built binary reports '${actual}', expected '${expected}' from tag ${TAG}. Bump package.json or fix the tag."
            exit 1
          fi

      - name: Package binaries
        run: |
          cd dist
          for f in forge-*; do
            if [[ "$f" == *.exe ]]; then
              cp "$f" forge.exe
              zip "${f%.exe}.zip" forge.exe
              rm forge.exe
            else
              cp "$f" forge
              chmod +x forge
              tar czf "${f}.tar.gz" forge
              rm forge
            fi
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > checksums.txt
          echo "── checksums ──"
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          retention-days: 5

  # ── 3. Publish to npm (first public channel) ─────────────────────
  publish-npm:
    name: Publish to npm
    needs: [ ci-gate, quality, test, build ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: bun install --frozen-lockfile
      - name: Publish
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "${version}" != "${TAG#v}" ]; then
            echo "::error::package.json version ${version} does not match tag ${TAG}."
            exit 1
          fi

          # A re-run must be able to finish a half-done release, and npm rejects republishing a version.
          if view="$(npm view "${name}@${version}" version 2>"${RUNNER_TEMP}/npm-view.err")"; then
            [ "${view}" = "${version}" ] && published=true || published=false
          elif grep -q E404 "${RUNNER_TEMP}/npm-view.err"; then
            published=false
          else
            cat "${RUNNER_TEMP}/npm-view.err"
            echo "::error::Could not check whether ${name}@${version} is already on npm."
            exit 1
          fi

          if [ "${published}" = true ]; then
            echo "${name}@${version} is already on npm, skipping publish."
          elif [ "${DRY_RUN}" = true ]; then
            if ! npm whoami >/dev/null 2>&1; then
              echo "::warning::npm rejects the configured credential (npm whoami failed). A real release would fail here."
            fi
            npm publish --access public --dry-run
          elif [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::The NPM_TOKEN repository secret is not set. Add an npm token with publish rights for ${name}."
            exit 1
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── 4. GitHub Release with binaries + release notes ──────────────
  github-release:
    name: GitHub Release
    needs: [ build, publish-npm ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          version="${TAG#v}"
          awk "/^## \[${version}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG entry for v${version}, using tag message."
            git tag -l --format='%(contents)' "${TAG}" > release-notes.md
          fi

          echo "── release notes ──"
          cat release-notes.md

      - name: Append install instructions
        run: |
          cat >> release-notes.md <<'EOF'

          ---

          ## Install

          **npm / bun** (requires [Bun](https://bun.sh))
          ```bash
          bun add -g @crucibledx/forge-cli
          # or: npm install -g @crucibledx/forge-cli
          ```

          **Homebrew** (macOS / Linux)
          ```bash
          brew install crucibledx/tap/forge
          ```

          **Shell script** (macOS / Linux)
          ```bash
          curl -fsSL https://raw.githubusercontent.com/crucibledx/forge-cli/main/scripts/install.sh | sh
          ```

          **Manual download**
          Download the binary for your platform from the assets below, extract, and add to your `PATH`.

          ### Checksums
          See `checksums.txt` in the release assets for SHA-256 verification.
          EOF

      - uses: softprops/action-gh-release@v2
        if: ${{ !inputs.dry_run }}
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true

  # ── 5. Update Homebrew tap ───────────────────────────────────────
  homebrew:
    name: Update Homebrew Tap
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Compute SHA-256 hashes
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum dist/forge-darwin-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_x64=$(sha256sum dist/forge-darwin-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x64=$(sha256sum dist/forge-linux-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum dist/forge-linux-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate Homebrew formula
        run: |
          VERSION="${TAG#v}"
          REPO="${{ env.REPO }}"

          cat > forge.rb <<FORMULA
          class Forge < Formula
            desc "AI development environment setup & config sync CLI"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/v${VERSION}/forge-darwin-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_arm64 }}"
              else
                url "https://github.com/${REPO}/releases/download/v${VERSION}/forge-darwin-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.darwin_x64 }}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/${REPO}/releases/download/v${VERSION}/forge-linux-arm64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_arm64 }}"
              else
                url "https://github.com/${REPO}/releases/download/v${VERSION}/forge-linux-x64.tar.gz"
                sha256 "${{ steps.sha.outputs.linux_x64 }}"
              end
            end

            def install
              bin.install "forge"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/forge --version")
            end
          end
          FORMULA
          cat forge.rb

      - name: Mint crucible-smith token for homebrew-tap
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SMITH_CLIENT_ID }}
          private-key: ${{ secrets.SMITH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap

      - name: Check out homebrew-tap
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: crucibledx/homebrew-tap
          token: ${{ steps.app-token.outputs.token }}
          path: homebrew-tap

      - name: Push formula to Homebrew tap
        if: ${{ !inputs.dry_run }}
        working-directory: homebrew-tap
        run: |
          mkdir -p Formula
          cp ../forge.rb Formula/forge.rb
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add Formula/forge.rb
          if git diff --cached --quiet; then
            echo "forge.rb already up to date"
            exit 0
          fi
          git commit -m "forge ${TAG}"
          git push origin HEAD

  # ── 6. Update Scoop bucket ──────────────────────────────────────
  scoop:
    name: Update Scoop Bucket
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist

      - name: Compute SHA-256 hash
        id: sha
        run: |
          echo "windows_x64=$(sha256sum dist/forge-windows-x64.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Generate Scoop manifest
        run: |
          VERSION="${TAG#v}"
          REPO="${{ env.REPO }}"

          cat > forge.json <<MANIFEST
          {
            "version": "${VERSION}",
            "description": "One source of truth for every AI tool your team uses",
            "homepage": "https://github.com/${REPO}",
            "license": "MIT",
            "architecture": {
              "64bit": {
                "url": "https://github.com/${REPO}/releases/download/v${VERSION}/forge-windows-x64.zip",
                "hash": "${{ steps.sha.outputs.windows_x64 }}"
              }
            },
            "bin": "forge.exe",
            "checkver": "github",
            "autoupdate": {
              "architecture": {
                "64bit": {
                  "url": "https://github.com/${REPO}/releases/download/v\$version/forge-windows-x64.zip"
                }
              }
            }
          }
          MANIFEST
          cat forge.json

      - name: Mint crucible-smith token for scoop-bucket
        if: ${{ !inputs.dry_run }}
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SMITH_CLIENT_ID }}
          private-key: ${{ secrets.SMITH_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: scoop-bucket

      - name: Check out scoop-bucket
        if: ${{ !inputs.dry_run }}
        uses: actions/checkout@v4
        with:
          repository: crucibledx/scoop-bucket
          token: ${{ steps.app-token.outputs.token }}
          path: scoop-bucket

      - name: Push manifest to Scoop bucket
        if: ${{ !inputs.dry_run }}
        working-directory: scoop-bucket
        run: |
          mkdir -p bucket
          cp ../forge.json bucket/forge.json
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add bucket/forge.json
          if git diff --cached --quiet; then
            echo "forge.json already up to date"
            exit 0
          fi
          git commit -m "forge ${TAG}"
          git push origin HEAD
