name: diag-21

on:
  push:
    branches: ['loop/21-windows-ci-flake']

permissions:
  contents: read

jobs:
  bench:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Focused tests, timed
        shell: bash
        run: |
          set +e +o pipefail
          start=$(date +%s); bun run scripts/run-tests.ts --timeout-ms 40000 -- scripts/test-sandbox.test.ts scripts/run-tests.test.ts scripts/dotenv-isolation.test.ts > focused.log 2>&1; code=$?
          grep -E '^\(pass\)|^\(fail\)|Ran |^ *[0-9]+ (pass|fail)|error' focused.log; echo "exit $code elapsed $(( $(date +%s) - start ))s"
      - name: test:platform, timed
        shell: bash
        run: |
          set +e +o pipefail
          start=$(date +%s); bun run test:platform > platform.log 2>&1; code=$?
          grep -E '^\(fail\)|Ran |^ *[0-9]+ (pass|fail)' platform.log; echo "exit $code elapsed $(( $(date +%s) - start ))s"
          grep -B2 -A30 '^error' platform.log | head -150
