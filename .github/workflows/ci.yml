name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lanes:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: quality, os: ubuntu-latest}
          - {lane: business, os: ubuntu-latest}
          - {lane: e2e, os: ubuntu-latest}
          - {lane: human-dx, os: ubuntu-latest}
          - {lane: agent-cli, os: ubuntu-latest}
          - {lane: security, os: ubuntu-latest}
          - {lane: performance, os: ubuntu-latest}
          - {lane: native-macos, os: macos-latest}
          - {lane: native-windows, os: windows-latest}
          - {lane: build, os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: install
        run: bun install --frozen-lockfile
      - name: Independent check 1
        if: always() && steps.install.outcome == 'success'
        run: bun run scripts/check-lanes.ts --lane "${{ matrix.lane }}" --check-index 0
      - name: Independent check 2
        if: always() && steps.install.outcome == 'success'
        run: bun run scripts/check-lanes.ts --lane "${{ matrix.lane }}" --check-index 1
      - name: Independent check 3
        if: always() && steps.install.outcome == 'success'
        run: bun run scripts/check-lanes.ts --lane "${{ matrix.lane }}" --check-index 2
      - name: Independent check 4
        if: always() && steps.install.outcome == 'success'
        run: bun run scripts/check-lanes.ts --lane "${{ matrix.lane }}" --check-index 3
      - name: Assemble lane evidence
        if: always() && steps.install.outcome == 'success'
        run: bun run scripts/check-lanes.ts --lane "${{ matrix.lane }}" --assemble
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
          path: results/
          retention-days: 7
          if-no-files-found: error

  gate:
    name: Deterministic gate
    needs: [lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        if: always()
        with:
          pattern: validation-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: results/incoming
      - name: All-results summary and fail-closed gate
        if: always()
        run: bun run scripts/gate.ts
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/gate-summary.json
          retention-days: 7
          if-no-files-found: error
