name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Check formatting
        run: bun run format:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Unit tests
        run: mkdir -p results && bun test src/ --reporter=default --reporter=junit --reporter-outfile=results/unit.xml
      - name: E2E tests
        if: always()
        run: bun test e2e/ --reporter=default --reporter=junit --reporter-outfile=results/e2e.xml
      - name: Test Report
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: results/*.xml
          include_passed: true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ quality, test ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Compile binary
        run: bun run build
      - name: Verify binary runs
        run: ./dist/forge --version
