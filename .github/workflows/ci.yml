name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  lanes:
    name: ${{ matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: quality, os: ubuntu-latest, checks: ['format:check', 'lint', 'typecheck']}
          - {lane: business, os: ubuntu-latest, checks: ['test:unit', 'test:properties', 'check:contracts', 'test:checkers']}
          - {lane: e2e, os: ubuntu-latest, checks: ['test:e2e']}
          - {lane: human-dx, os: ubuntu-latest, checks: ['test:human']}
          - {lane: agent-cli, os: ubuntu-latest, checks: ['test:agent']}
          - {lane: security, os: ubuntu-latest, checks: ['test:security', 'check:security-audit']}
          - {lane: performance, os: ubuntu-latest, checks: ['test:performance']}
          - {lane: native-macos, os: macos-15-intel, checks: ['build', 'test:platform', 'test:compiled']}
          - {lane: native-windows, os: windows-latest, checks: ['build', 'test:platform', 'test:compiled']}
          - {lane: build, os: ubuntu-latest, checks: ['build', 'test:compiled']}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: install
        run: bun install --frozen-lockfile
      # Separate always() steps: an early failing check must not hide later checks' results.
      - if: always() && steps.install.outcome == 'success' && matrix.checks[0]
        run: bun run ${{ matrix.checks[0] }}
      - if: always() && steps.install.outcome == 'success' && matrix.checks[1]
        run: bun run ${{ matrix.checks[1] }}
      - if: always() && steps.install.outcome == 'success' && matrix.checks[2]
        run: bun run ${{ matrix.checks[2] }}
      - if: always() && steps.install.outcome == 'success' && matrix.checks[3]
        run: bun run ${{ matrix.checks[3] }}

  # The required check. needs.lanes.result is success only if every matrix lane succeeded in this run attempt,
  # including lanes carried over by "Re-run failed jobs"; failed, cancelled or skipped lanes fail it.
  gate:
    name: Deterministic gate
    needs: [lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to succeed
        env:
          LANES: ${{ needs.lanes.result }}
        run: |
          echo "lanes: $LANES"
          test "$LANES" = success
