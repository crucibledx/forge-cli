name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lanes:
    name: ${{ matrix.harness && format('{0} ({1}, {2} scope)', matrix.lane, matrix.harness, matrix.scope) || matrix.lane }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Selects the plugin-load-check job; empty for every other lane. No lane receives secrets or auth env.
    env:
      LOAD_CHECK_HARNESS: ${{ matrix.harness }}
      LOAD_CHECK_SCOPE: ${{ matrix.scope }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {lane: quality, os: ubuntu-latest, checks: ['format:check', 'lint', 'typecheck']}
          - {
              lane: business,
              os: ubuntu-latest,
              checks: ['test:unit', 'test:properties', 'check:contracts', 'test:checkers'],
            }
          - {lane: e2e, os: ubuntu-latest, checks: ['test:e2e']}
          - {lane: human-dx, os: ubuntu-latest, checks: ['test:human']}
          - {lane: agent-cli, os: ubuntu-latest, checks: ['test:agent']}
          - {lane: security, os: ubuntu-latest, checks: ['test:security', 'check:security-audit']}
          - {lane: performance, os: ubuntu-latest, checks: ['test:performance']}
          - {lane: native-macos, os: macos-15-intel, checks: ['build', 'test:platform', 'test:compiled']}
          - {lane: native-windows, os: windows-latest, checks: ['build', 'test:platform', 'test:compiled']}
          - {lane: build, os: ubuntu-latest, checks: ['build', 'test:compiled']}
          - {lane: harness-smoke, os: ubuntu-latest, checks: ['build', 'test:harness-smoke']}
          - {
              lane: plugin-load-check,
              os: ubuntu-latest,
              harness: claude-code,
              scope: user,
              checks: ['build', 'test:plugin-load-check'],
            }
          - {
              lane: plugin-load-check,
              os: ubuntu-latest,
              harness: claude-code,
              scope: project,
              checks: ['build', 'test:plugin-load-check'],
            }
          - {
              lane: plugin-load-check,
              os: ubuntu-latest,
              harness: droid,
              scope: user,
              checks: ['build', 'test:plugin-load-check'],
            }
          - {
              lane: plugin-load-check,
              os: ubuntu-latest,
              harness: droid,
              scope: project,
              checks: ['build', 'test:plugin-load-check'],
            }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: install
        run: bun install --frozen-lockfile
      # Separate always() steps: an early failing check must not hide later checks' results.
      - name: ${{ matrix.checks[0] || 'no check registered at this index' }}
        if: always() && steps.install.outcome == 'success' && matrix.checks[0]
        run: bun run ${{ matrix.checks[0] }}
      - name: ${{ matrix.checks[1] || 'no check registered at this index' }}
        if: always() && steps.install.outcome == 'success' && matrix.checks[1]
        run: bun run ${{ matrix.checks[1] }}
      - name: ${{ matrix.checks[2] || 'no check registered at this index' }}
        if: always() && steps.install.outcome == 'success' && matrix.checks[2]
        run: bun run ${{ matrix.checks[2] }}
      - name: ${{ matrix.checks[3] || 'no check registered at this index' }}
        if: always() && steps.install.outcome == 'success' && matrix.checks[3]
        run: bun run ${{ matrix.checks[3] }}

  # The required check. needs.lanes.result is success only if every matrix lane succeeded in this run attempt,
  # including lanes carried over by "Re-run failed jobs"; failed, cancelled or skipped lanes fail it.
  gate:
    name: Deterministic gate
    needs: [lanes]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every lane to succeed
        env:
          LANES: ${{ needs.lanes.result }}
        run: |
          echo "lanes: $LANES"
          test "$LANES" = success
